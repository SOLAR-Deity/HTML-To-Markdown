name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          node -e "const fs = require('fs'); JSON.parse(fs.readFileSync('manifest.json', 'utf8'));"

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/html-toc-assistant-${GITHUB_REF_NAME}.zip" \
            manifest.json \
            background.js \
            content.js \
            popup.html \
            popup.css \
            popup.js \
            styles.css \
            README.md \
            PRIVACY.md \
            CHANGELOG.md \
            LICENSE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/html-toc-assistant-${GITHUB_REF_NAME}.zip" \
            --title "HTML 目录助手 ${GITHUB_REF_NAME}" \
            --generate-notes
